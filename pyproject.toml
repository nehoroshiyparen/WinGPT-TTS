[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "wgtts"
version = "0.1.0"
description = "WinGPT TTS: a voice companion for the Windows ChatGPT application"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pywinauto==0.6.9; sys_platform == 'win32'",
    "Pillow==13.0.0",
    "sounddevice==0.5.6",
    "prompt_toolkit==3.0.53",
]

[project.optional-dependencies]
dev = ["build>=1.2", "ruff>=0.9"]
media = ["imageio-ffmpeg>=0.6"]

[project.scripts]
wgtts = "wgtts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["wgtts*"]
namespaces = false

[tool.setuptools.package-data]
wgtts = ["assets/*.gif", "assets/*.webp", "assets/*.png", "assets/*.ico"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["tools/legacy"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
